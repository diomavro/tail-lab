# Fly.io app config for tail-lab (single container: FastAPI serves the built
# SPA directly). The lakehouse lives on Fly Tigris object storage
# (bucket tail-lab-lake) — no volume needed; the AWS_* credentials are Fly
# secrets on this app (set by `fly storage create`). See docs/adr/0012.
app = "tail-lab"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TAIL_LAB_LAKE_BACKEND = "tigris"
  TAIL_LAB_S3_BUCKET = "tail-lab-lake"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

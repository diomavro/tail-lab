[project]
name = "tail-lab"
version = "0.1.0"
description = "Tail-risk hedging research platform — walking skeleton."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.0.0",
    "pandera[pandas]>=0.20.0",
    "pyarrow>=17.0.0",
    "scipy>=1.13.0",
    "requests>=2.32.0",
    "deltalake>=1.0.0",
    # Reads the hand-downloaded optionsDX .7z corpus in place. A runtime dep
    # rather than dev-only because ingestion/ is library code, but nothing in
    # research/ or api/ touches it: the whole dataset is optional and absent
    # from CI and the deployed app (contracts/optionsdx).
    "py7zr>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    # Test-only, never imported by src/. The reference integral for the
    # Paretan put price needs arbitrary precision: scipy.integrate.quad is
    # 128% wrong on that integrand at alpha=8 near the domain edge (r^(-alpha-1)
    # over a ~1e27 dynamic range) and fails silently, so a test built on it
    # would condemn correct code. See docs/adr/0026.
    "mpmath>=1.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.32.0",
    "scipy-stubs>=1.13.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tail_lab*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", "dist", "frontend", "data", ".venv"]

[tool.ruff.lint]
# The first seven families catch bugs and style. The last five exist because
# CI could previously see everything about this code EXCEPT whether it was
# well designed, and 75% of merged PRs are written by an unattended agent
# whose charter forbids it from cleaning anything up. Measured 2026-08-28:
# the agent adds 15.8 lines for every 1 it deletes; humans on this same repo
# run 2.4:1. Nothing in the gate could see that.
#
# SIM/RET/PIE/ARG were all at ZERO findings when enabled, which is the useful
# nuance: the agent does not write sloppy lines. The decay is structural —
# functions accumulating parameters because extending is always cheaper than
# reshaping. So those four are free to enforce forever, and the three counters
# below are a RATCHET.
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "RET", "PIE", "ARG", "C901", "PLR0913", "PLR0915", "PLR0917"]
ignore = [
    "E501", # line too long — handled by the formatter
    "B008", # function calls in argument defaults — FastAPI Depends
]

# RATCHET. These are today's worst offenders, not a design opinion: a limit set
# where the code already is costs nothing now and makes it impossible for the
# next 400 agent PRs to make it worse. **These numbers may only ever go down.**
# Lowering them is a one-line PR gated on refactoring the functions named in
# AGENT_TODO.md; raising one means an increment made the codebase measurably
# worse and should be rejected instead.
# pytest fixtures are requested by name and used for their side effect, so a
# test that takes `fixed_clock` and never references it is correct, not dead.
# ARG cannot tell those apart from a genuinely unused parameter, and in library
# code it can — so it stays on there and off here.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.mccabe]
max-complexity = 10 # ingestion.optionsdx.ingest_optionsdx, portfolio.run_portfolio

[tool.ruff.lint.pylint]
max-args = 13 # put_roll.run_put_roll — keyword-only, which is why it is survivable
max-positional-args = 8
max-statements = 75 # put_roll.run_put_roll

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict on src/tail_lab
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["frontend", "data", ".venv"]


[[tool.mypy.overrides]]
# py7zr ships no type stubs; the adapter wraps it in one narrow function.
module = ["py7zr"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "pandera.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deltalake", "deltalake.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/tail_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ---------------------------------------------------------------------------
# import-linter — enforce the medallion layering, machine-checked
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "tail_lab"

[[tool.importlinter.contracts]]
name = "Layered architecture: api > research > (ingestion | transforms | feedback | memory) > lake > contracts"
type = "layers"
layers = [
    "tail_lab.api",
    "tail_lab.research",
    "tail_lab.ingestion | tail_lab.transforms | tail_lab.feedback | tail_lab.memory",
    "tail_lab.lake",
    "tail_lab.contracts",
]

# The layers contract above already forbids contracts (bottom layer) from
# importing any layer above it; contracts has no layer below it, so it is
# a leaf by construction as long as the layers contract passes.

# Carve-out: the read/serve side never imports ingestion. Fetching is a
# write-path concern (the ingestion schedule / the agent), never triggered
# by an HTTP request or a metric/backtest. The layers contract permits
# api->ingestion and research->ingestion (both sit above ingestion); this
# forbidden contract closes that gap. See ARCHITECTURE.md §dependency rule.
[[tool.importlinter.contracts]]
name = "The read/serve side never imports ingestion"
type = "forbidden"
source_modules = [
    "tail_lab.api",
    "tail_lab.research",
]
forbidden_modules = [
    "tail_lab.ingestion",
]

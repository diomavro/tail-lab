[project]
name = "tail-lab"
version = "0.1.0"
description = "Tail-risk hedging research platform — walking skeleton."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "duckdb>=1.0.0",
    "pandera[pandas]>=0.20.0",
    "pyarrow>=17.0.0",
    "scipy>=1.13.0",
    "requests>=2.32.0",
    "deltalake>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0",
    "pandas-stubs>=2.2.0",
    "types-requests>=2.32.0",
    "scipy-stubs>=1.13.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tail_lab*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", "dist", "frontend", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = [
    "E501", # line too long — handled by the formatter
    "B008", # function calls in argument defaults — FastAPI Depends
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict on src/tail_lab
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["frontend", "data", ".venv"]

[[tool.mypy.overrides]]
module = "pandera.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deltalake", "deltalake.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/tail_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

# ---------------------------------------------------------------------------
# import-linter — enforce the medallion layering, machine-checked
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "tail_lab"

[[tool.importlinter.contracts]]
name = "Layered architecture: api > research > (ingestion | transforms | feedback | memory) > lake > contracts"
type = "layers"
layers = [
    "tail_lab.api",
    "tail_lab.research",
    "tail_lab.ingestion | tail_lab.transforms | tail_lab.feedback | tail_lab.memory",
    "tail_lab.lake",
    "tail_lab.contracts",
]

# The layers contract above already forbids contracts (bottom layer) from
# importing any layer above it; contracts has no layer below it, so it is
# a leaf by construction as long as the layers contract passes.

# Carve-out: the read/serve side never imports ingestion. Fetching is a
# write-path concern (the ingestion schedule / the agent), never triggered
# by an HTTP request or a metric/backtest. The layers contract permits
# api->ingestion and research->ingestion (both sit above ingestion); this
# forbidden contract closes that gap. See ARCHITECTURE.md §dependency rule.
[[tool.importlinter.contracts]]
name = "The read/serve side never imports ingestion"
type = "forbidden"
source_modules = [
    "tail_lab.api",
    "tail_lab.research",
]
forbidden_modules = [
    "tail_lab.ingestion",
]

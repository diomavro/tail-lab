name: Daily verdict sweep

# Records Put Lab regime verdicts across the screening universe into the
# hypothesis memory (docs/adr/0015), so run_count and prior art accumulate
# day over day instead of only from a one-off manual seed. Runs at 06:30 UTC,
# BEFORE the daily platform agent (07:00), so the agent reads fresh verdicts
# the same day.
#
# Deliberately least-privilege: this deterministic curl sweep only needs
# TAIL_LAB_FEEDBACK_TOKEN (the record endpoint's gate) — no CLAUDE_CODE OAuth,
# no lake/deploy credentials. The live app holds the object-storage creds and
# does the actual write, keeping the no-credentials wall intact. Kept as its
# own workflow (not a step in daily-agent.yml) so a sweep failure is isolated
# from the agent's run and its §f audit trail stays one-run-one-purpose.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verdict-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Record regime verdicts across the universe
        env:
          TOKEN: ${{ secrets.TAIL_LAB_FEEDBACK_TOKEN }}
          BASE: https://tail-lab.fly.dev
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::TAIL_LAB_FEEDBACK_TOKEN not set — skipping the verdict sweep."
            exit 0
          fi
          # Universe comes from the live app so the sweep stays in sync as it grows.
          symbols=$(curl -s "$BASE/api/putlab/universe" \
            | python3 -c "import sys,json;print(' '.join(m['symbol'].lower() for m in json.load(sys.stdin)))")
          if [ -z "$symbols" ]; then
            echo "::error::could not fetch the universe from $BASE"; exit 1
          fi
          # A signal-dense grid: near- and mid-OOM at the 1-month rolling horizon
          # over the 4-year window. run_count grows each day; strikes/tenors can
          # widen later without changing this workflow's shape.
          n=0; ok=0
          for s in $symbols; do
            for m in 5 10; do
              code=$(curl -s -o /tmp/rec.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $TOKEN" \
                "$BASE/api/putlab/memory/record?asset=$s&moneyness_pct=$m&tenor_weeks=4&years=4")
              n=$((n + 1))
              if [ "$code" = "200" ]; then
                ok=$((ok + 1))
                v=$(python3 -c "import json;print(json.load(open('/tmp/rec.json'))['verdict'])" 2>/dev/null || echo "?")
                echo "recorded $s ${m}% OOM / 4w -> $v"
              else
                echo "skip $s ${m}% OOM / 4w -> HTTP $code"
              fi
            done
          done
          echo "verdict sweep done: recorded $ok of $n (rule, regime) verdicts into the hypothesis memory"

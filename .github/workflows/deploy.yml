name: Deploy

# Continuous deployment (docs/adr/0016): every commit that lands on main and
# passes the full CI gate deploys to Fly automatically. Triggered ONLY by
# workflow_dispatch — CI's trigger-deploy job dispatches this after all its
# jobs succeed on main. workflow_run cannot be used here: GitHub's
# GITHUB_TOKEN recursion prevention also suppresses workflow_run events
# emitted by bot-initiated runs (found empirically on PR #11 — the
# auto-merge path produced CI but no Deploy), while workflow_dispatch
# creations are exempt even under GITHUB_TOKEN. The agent never runs this
# and never holds the token — this is platform CD triggered by the merge,
# keeping the no-credentials wall (docs/adr/0007) intact. Until
# FLY_API_TOKEN is provisioned (HUMAN_TODO.md) the job no-ops with a
# visible notice instead of failing red.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Deploys the tip of main at dispatch time. Dispatches only ever come
    # from CI's trigger-deploy job (gated on all CI jobs green on main) or
    # a human running `gh workflow run deploy.yml`.
    runs-on: ubuntu-latest
    steps:
      - name: Check FLY_API_TOKEN is provisioned
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set — skipping deploy (see HUMAN_TODO.md / docs/adr/0016)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.ready == 'true'

      # --verbose: the deploy log is part of the audit trail (docs/adr/0016
      # decision 4) — what image, what release, what health checks.
      - name: Deploy to Fly
        if: steps.guard.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --verbose -a tail-lab

      - name: Record what shipped
        if: steps.guard.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deployed $(git rev-parse HEAD) (dispatched by ${{ github.actor }})"
          flyctl releases -a tail-lab | head -5

name: CI

# Every gate in `make check`, plus the frontend build and the browser suite —
# nothing merges red. No external accounts are needed and nothing here touches
# the network: the VIX adapter's live call is only exercised by
# `make ingest-vix` (a human-run target), and the Playwright suite answers
# every /api/** call from `frontend/e2e/fixtures/` (docs/adr/0017).

env:
  # Bound on the review -> fix -> re-review loop (docs/adr/0024). "Loop until
  # the review is clean" and "loop forever" are the same program whenever the
  # reviewer and the fixer disagree, so the disagreement has to terminate.
  MAX_FIX_ROUNDS: 3

on:
  push:
    branches: [main]
  # `ready_for_review` is NOT in the default activity set (opened, synchronize,
  # reopened). Without it a PR opened as a draft runs CI, goes green, is
  # declined by automerge's draft check, and then never runs CI again when it
  # is marked ready -- so no `workflow_run` fires and it can never merge. It
  # would sit green and stuck until someone pushed an empty commit.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dispatched by the automerge workflow after it squash-merges an agent PR:
  # pushes made with GITHUB_TOKEN do not trigger `push` workflows (GitHub's
  # recursion prevention), but workflow_dispatch is exempt — so this is how
  # an auto-merged commit on main gets CI (and, via the Deploy workflow's
  # workflow_run trigger, gets deployed). See docs/adr/0016.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format --check
        run: ruff format --check src tests scripts

      - name: mypy --strict (src/tail_lab)
        run: mypy src/tail_lab

      - name: import-linter (module layering)
        run: lint-imports

      - name: pytest (with coverage)
        run: python -m pytest --cov=tail_lab --cov-report=term-missing --cov-report=xml

      - name: coverage floors (research/ + transforms/ >= 90%, STANDARDS §e)
        run: coverage report --include="src/tail_lab/research/*,src/tail_lab/transforms/*" --fail-under=90

  # Two checks that cost a second and would have caught a real outage. On
  # 2026-09-01 a Makefile was committed with unresolved conflict markers on two
  # branches: `make` failed to parse for EVERY target, and since make is the
  # only sanctioned entry point for the gates (CLAUDE.md's `env -u PYTHONPATH`
  # isolation), that broke `make check`, `make lint` and `make test` for anyone
  # who pulled. All four other jobs stayed green -- ruff does not read
  # Makefiles and pytest never invokes make -- and only the LLM design reviewer
  # noticed. That was lucky, and luck is not a gate: anything a `grep` can
  # catch should never cost a model call (docs/adr/0023).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No unresolved merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- .; then
            echo "::error::Unresolved merge-conflict markers are committed above."
            exit 1
          fi
          echo "clean"

      - name: The Makefile parses
        # `make help` touches no venv and runs no tool -- it only proves the
        # file is syntactically a Makefile, which is exactly what was broken.
        run: make help > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

      - name: npm run build
        run: npm run build

  # The browser suite. Hermetic by construction — Playwright starts its own Vite
  # dev server and `e2e/fixtures/mock-api.ts` answers every /api/** call, so this
  # needs no lake, no backend and no network, and it is deterministic enough to
  # gate a deploy on. It is a separate job from `frontend` so a red run says
  # "e2e", not "build", and so the fast build gate stays fast.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # Keyed on the lockfile: the browser build Playwright wants is pinned by
      # the @playwright/test version, so a lockfile change is exactly when the
      # cache should miss.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Chromium only — the suite declares one project. `--with-deps` still runs
      # on a cache hit (it installs the system libraries, not the browser) and
      # is cheap once the download is skipped.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run e2e
        run: npm run e2e

      # Traces and failure screenshots, per playwright.config.ts's
      # retain-on-failure / only-on-failure. The `list` reporter writes no HTML
      # report, so this is the artifact worth keeping.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The "constitution" (big-picture docs) stays human-curated: an agent/* PR
  # that edits it fails here, so auto-merge cannot land it — a human must.
  # Human PRs are unaffected. Required check, so auto-merge can't skip it.
  constitution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block autonomous edits to the constitution
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$HEAD_REF" != agent/* ]]; then
            echo "Not an agent PR (head='$HEAD_REF') — constitution guard N/A."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^docs/adr/|^\.github/workflows/|^ARCHITECTURE\.md$|^docs/STANDARDS\.md$|^README\.md$|^docs/AGENT_MISSION\.md$|^docs/END_STATE\.md$'; then
            echo "::error::This agent PR edits the constitution (docs/adr, ARCHITECTURE.md, STANDARDS.md, README.md, AGENT_MISSION.md, END_STATE.md) or .github/workflows (where the agent's own instructions and this guard live). A human must review + merge it — auto-merge is blocked."
            exit 1
          fi
          echo "OK: agent PR leaves the constitution untouched."

  # Chain to Deploy via workflow_dispatch — the one trigger type exempt from
  # GitHub's GITHUB_TOKEN recursion prevention. A workflow_run trigger on
  # Deploy would never fire for bot-initiated CI runs (the auto-merge path),
  # because the suppression also swallows the workflow_run event a
  # bot-initiated run emits on completion (docs/adr/0016, found on PR #11).
  # Runs only on main (push or dispatched-by-automerge), only when every
  # gate above is green.
  # Reviews what every other gate here is structurally blind to. ruff, mypy,
  # import-linter and the coverage floors can prove a change is correct, typed,
  # layered and tested; none of them can see duplication, dead abstraction, or
  # a function quietly growing its fourteenth parameter.
  #
  # That blindness matters most for the unattended agent, which writes 75% of
  # merged PRs here, auto-merges on green CI, and whose charter (rightly)
  # forbids it from cleaning up anything unrelated to its task. Measured
  # 2026-08-28: the agent adds 15.8 lines for every 1 it deletes; humans on
  # this same repo run 2.4:1. Nothing was watching that number.
  #
  # It is not only for the agent, though, and scoping it that way was a
  # mistake worth recording: for a month this job ran on `agent/` branches
  # alone, so every PR from a human or a human's assistant showed
  # `agent-review=SKIPPED`. An assistant-written PR is unattended code too --
  # it is simply unattended at a different moment -- and the author is the one
  # party who cannot review it. Now every pull request gets read.
  #
  # Runs as a JOB IN CI rather than a workflow_run listener on purpose:
  # workflow_run events from bot-initiated runs are suppressed by GitHub
  # (docs/adr/0016), so a listener would never fire on the exact PRs it exists
  # to review. As a CI job it also blocks auto-merge for free -- automerge.yml
  # only acts when the whole CI run succeeded.
  agent-review:
    # EVERY pull request, not just the daily agent's. The job was scoped to
    # `agent/` branches on the theory that unattended code is what needs an
    # adversarial reader -- which got it backwards: the reviewer was built here
    # and then every human PR was routed around it, so the checks reported
    # `agent-review=SKIPPED` on exactly the changes nobody else was reviewing.
    # A review that only inspects the author who already has a second reader is
    # not a gate. Gated to `pull_request` because every step below reads
    # `github.event.pull_request.*`, which is null on push and dispatch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available in a step-level `if:`, so the
      # token's presence is reduced to a boolean here, where it is.
      HAS_FIX_TOKEN: ${{ secrets.AGENT_FIX_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # AGENT_FIX_TOKEN (a PAT) rather than github.token, because the whole
      # loop turns on one GitHub rule: a push made with GITHUB_TOKEN does NOT
      # trigger workflows (recursion prevention, docs/adr/0016). A fix pushed
      # with the default token would therefore never be re-reviewed, and the
      # loop would stall after exactly one round. Falls back to github.token,
      # in which case the job still reviews and still blocks — it just cannot
      # fix, which is the behaviour up to 2026-09-02.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_FIX_TOKEN || github.token }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # The review step runs Bash over a diff the PR author wrote. With
          # persist-credentials (the default) the PAT is written into
          # .git/config as an http.extraheader, where `git config --get` reads
          # it back -- so prompt-injected text in the diff could exfiltrate it
          # or push with it. The push step re-supplies the token explicitly.
          persist-credentials: false

      - name: How many fix rounds has this branch already had?
        id: rounds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          n=$(git log --oneline "$BASE_SHA..HEAD" --grep='^\[review-fix\]' | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          # Every branch, not just the agent's: the loop is review -> fix ->
          # re-review -> merge, and a PR that gets the review but not the fixer
          # is back to being an alarm rather than a control loop. The fixer is
          # told to push back on findings it thinks are wrong rather than
          # contort the code, so a disagreement terminates the loop honestly.
          if [ "$n" -lt "${MAX_FIX_ROUNDS}" ] && [ "${HAS_FIX_TOKEN}" = "true" ]; then
            echo "can_fix=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_fix=false" >> "$GITHUB_OUTPUT"
          fi
          echo "prior fix rounds: $n (max ${MAX_FIX_ROUNDS}); fix token: ${HAS_FIX_TOKEN}"
        # A bound, because "loop until the review is clean" and "loop forever"
        # are the same program when the reviewer and the fixer disagree.

      - name: Adversarial design review
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          claude_args: '--allowedTools Bash,Read,Grep,Glob'
          prompt: |
            You are the adversarial design reviewer for this pull request. You did not write
            the change and have no stake in it landing. Review it the same way whoever opened
            it — the daily agent, a human, or a human's assistant — because the point of this
            job is that no author reviews their own work. Do not soften a finding because the
            author looks careful, and do not manufacture one to look useful.

            If earlier commits on this branch are prefixed `[review-fix]`, a previous round of
            this same review asked for them — review them as critically as anything else; a fix
            that missed the point is a finding, not a resolution.

            FIRST, before anything else, record that you ran at all:

              touch /tmp/claude-review-ran

            That file is how CI tells "the reviewer ran and reached no verdict"
            apart from "the reviewer never started". Do not skip it.

            Read the diff first:  git diff "$BASE_SHA...HEAD"

            **What you are NOT for.** Correctness, types, layering, formatting and coverage are
            already proven by other jobs in this same run. Do not re-check them. If your finding
            would have been caught by ruff or mypy, it is not your finding.

            **What you ARE for** — the four things no linter here can see:

            1. DUPLICATION. Does this re-implement something that already exists? `grep -rn`
               before concluding it does not. One ingestion adapter per dataset is a sanctioned
               near-duplicate in `ingestion/` and is NOT a finding; duplication in `research/`
               or `api/` is.
            2. DEAD OR SPECULATIVE CODE. A parameter nothing passes, a branch nothing reaches,
               an abstraction with one implementation and no second in sight.
            3. ACCRETION. Did a function gain parameters instead of being reshaped? The known
               offenders are in `AGENT_TODO.md`; making one worse is a finding.
            4. UNEARNED COMPLEXITY. Is there a materially simpler version that passes the same
               tests?

            **Blocking bar.** Block ONLY when you can name the file and line, quote the code, and
            state what should have happened instead. Taste, naming preferences and speculative
            future-proofing are ADVISORY, never blocking. **When uncertain, pass.**

            Post the review as a PR comment either way, so there is a record:
              gh pr comment "$PR_NUMBER" --body "<your review>"

            Advisory notes matter even on a PASS — the daily agent now reads them (step 2b of
            its charter), so write them to be acted on, not to be admired.

            Then write your verdict, exactly one word, nothing else. **Which word you
            choose decides whether this PR can ever merge**, so choose on consequence,
            not on how much the finding annoys you:

              echo PASS     > /tmp/verdict
                Nothing to act on. Advisory notes are fine and still get read.

              echo FINDINGS > /tmp/verdict
                Real quality problems — duplication, dead code, accretion, unearned
                complexity — in code that WORKS. The loop will try to fix them and
                re-review. If it cannot converge, they are filed to `AGENT_TODO.md`
                and **the PR merges anyway**: an unfixed nit is a smaller cost than a
                correct increment rotting unmerged forever, and the finding is not lost
                because it is now queued work. This is the right verdict for almost
                everything you will find.

              echo DEFECT   > /tmp/verdict
                Something is actually BROKEN and merging it would ship the breakage:
                the build or a tool cannot run, a test is weakened or disabled to get
                green, a security or auth control is wrong, data is corrupted or
                silently mis-parsed, the constitution is violated. **DEFECT never
                auto-merges, at any number of rounds.** Reserve it. A conflict-marked
                Makefile that breaks every `make` target is a DEFECT; a duplicated
                helper is not, however much it ought to be fixed.

      - name: Read the verdict
        id: verdict
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          raw="$(tr -d '[:space:]' < /tmp/verdict 2>/dev/null || true)"
          # Normalise before matching. The reviewer is an LLM told to write one
          # bare word; it may write `**DEFECT**`, `Defect`, or `DEFECT.` — all
          # natural outputs that an exact string comparison misses. Every miss
          # used to fall through the enforce step's final `exit 0`, i.e. the
          # MERGE path, so the most emphatic way to write the one unconditional
          # block was also the way to get it ignored. Strip to letters, upcase,
          # and treat anything still unrecognised as a block, not a pass.
          norm="$(printf '%s' "$raw" | tr -cd '[:alpha:]' | tr '[:lower:]' '[:upper:]')"
          case "$norm" in
            PASS)     v=PASS ;;
            FINDINGS) v=FINDINGS ;;
            DEFECT)   v=DEFECT ;;
            "")       v=NONE ;;
            *)        v=UNRECOGNISED ;;
          esac
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "verdict: $v (raw: ${raw:-<empty>})"

          # WHY a missing verdict happened, which decides whether it is safe.
          #
          # claude-code-action refuses to run when the calling workflow differs
          # from the copy on the default branch -- so a PR cannot rewrite the
          # reviewer that judges it. That is benign AND self-limiting: such a
          # PR touches .github/**, which automerge.yml refuses to merge, so a
          # human reads it regardless.
          #
          # Every OTHER cause -- an expired CLAUDE_CODE_OAUTH_TOKEN, an API
          # 5xx, a usage limit, an action regression -- is an outage, and the
          # PR is then unreviewed AND mergeable. Conflating the two is exactly
          # the mistake docs/adr/0025 shipped with: it claimed unreviewable
          # implied unmergeable, which holds only for the first case.
          if [ -f /tmp/claude-review-ran ]; then
            reason="ran"
          elif [ "${REVIEW_OUTCOME}" = "success" ]; then
            # The action exits 0 when it self-skips on workflow validation:
            # "the workflow file must ... have identical content to the version
            # on the default branch". TWO very different situations produce
            # that, and only one is safe:
            #
            #   a) this PR EDITS .github/workflows -- benign, because such a
            #      PR cannot auto-merge anyway (automerge.yml refuses it), so a
            #      human reads it regardless;
            #   b) this branch is merely STALE -- main changed ci.yml after the
            #      branch was cut. The PR touches no workflow, is perfectly
            #      mergeable, and gets NO review. Observed on PR #76, which
            #      changed two Python files, was skipped because main had moved
            #      on via #77, and auto-merged unreviewed.
            #
            # (b) is the dangerous one and it is the COMMON one: every branch
            # older than the last ci.yml change is in it.
            # Ask the question the action actually asks -- does THIS branch's
            # ci.yml differ from the default branch's? -- rather than proxying
            # it with "did the PR touch a workflow file". The proxy gets the
            # common case wrong in both directions: a stale branch that edits
            # deploy.yml looks like a workflow edit (and passes), and a
            # reviewer that ran but wrote no verdict looks stale (and is told
            # to rebase, which cannot help).
            # `?ref=` in the URL, NOT `-f ref=main`: `-f` adds a POST field and
            # flips the method, which answers 404 for a contents read. Verified
            # both forms; the URL form returns the blob sha and it matches
            # `git hash-object` on the same content exactly.
            if ! main_ci=$(gh api \
                 "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/ci.yml?ref=main" \
                 --jq '.sha' 2>/dev/null); then
              reason="classify_failed"
            else
              here_ci=$(git hash-object .github/workflows/ci.yml)
              if [ "$here_ci" = "$main_ci" ]; then
                # Identical to main, so validation did not fail on this file.
                reason="outage"
              elif gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                     --jq '.[].filename' 2>/dev/null | grep -q '^\.github/workflows/'; then
                reason="workflow_edit_skip"
              else
                reason="stale_branch_skip"
              fi
            fi
          else
            reason="outage"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "no-verdict reason: $reason (review step outcome: ${REVIEW_OUTCOME})"

      # Only pay for the toolchain when there is actually something to fix.
      - name: Install the full toolchain
        if: steps.verdict.outputs.value == 'FINDINGS' && steps.rounds.outputs.can_fix == 'true'
        run: |
          pip install -e ".[dev]"
          cd frontend && npm ci

      - name: Apply the review's findings
        if: steps.verdict.outputs.value == 'FINDINGS' && steps.rounds.outputs.can_fix == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          claude_args: '--allowedTools Bash,Read,Write,Edit,Grep,Glob'
          prompt: |
            A design review just BLOCKED this pull request. Read its findings — the most recent
            review comment on PR $PR_NUMBER:

              gh pr view "$PR_NUMBER" --json comments --jq '.comments[-1].body'

            Fix what it found, and **only** what it found. You are not here to improve the PR;
            you are here to answer a specific review. Scope creep makes the next review harder
            and defeats the loop.

            You may DISAGREE. If a finding is wrong — it misreads the code, or the pattern it
            objects to is sanctioned elsewhere in this repo — do not contort the code to satisfy
            it. Leave that part alone and say so plainly in a PR comment, with the evidence.
            The next review round reads the diff fresh; a reasoned disagreement recorded in the
            thread is a legitimate way for this loop to terminate, and a worse outcome than
            either is code bent to satisfy a reviewer that was mistaken.

            Everything in `docs/AGENT_MISSION.md` still binds you — above all the constitution
            rule: never edit `README.md`, `ARCHITECTURE.md`, `docs/STANDARDS.md`,
            `docs/AGENT_MISSION.md`, `docs/END_STATE.md`, `docs/adr/**` or `.github/workflows/**`.
            If a finding can only be resolved by editing one of those, do not: say so in a
            comment and stop.

            VALIDATE before you finish — the other CI jobs in this run tested the code as it was
            BEFORE your fix, so their green is now stale and you are the only thing standing
            between a broken change and a merge:
              ruff check src tests scripts
              ruff format --check src tests scripts
              mypy src/tail_lab
              lint-imports
              python -m pytest --cov=tail_lab --cov-report=term-missing
              coverage report --include="src/tail_lab/research/*,src/tail_lab/transforms/*" --fail-under=90
            and if you touched the frontend: cd frontend && npm run typecheck && npm run build

            Do NOT commit or push — a later step does that. Just leave the working tree fixed.

      - name: Push the fix and hand off to a fresh review
        id: pushed
        # continue-on-error so a push failure cannot skip the verdict step below.
        # It could, and did, on the very first live run (2026-09-03): the token
        # in AGENT_FIX_TOKEN was rejected, step 8 failed, and step 9 never ran --
        # so the job reported a bare failure indistinguishable from the reviewer
        # blocking the PR. A credential fault and a design objection are opposite
        # problems with opposite fixes, and the gate must say which it hit.
        continue-on-error: true
        if: steps.verdict.outputs.value == 'FINDINGS' && steps.rounds.outputs.can_fix == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.AGENT_FIX_TOKEN || github.token }}
          # Via env, not `${{ }}` inlined into the script: a branch name may
          # contain `$`, backticks or `$(...)`, and expression interpolation
          # pastes it into the shell source before bash ever sees it.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning::the fixer changed nothing. Either it judged the findings"
            echo "wrong and said so in a comment — a legitimate way for this loop to"
            echo "end — or it could not act on them. Either way there is nothing to"
            echo "re-review, so the verdict below MERGES with the findings unresolved"
            echo "(docs/adr/0024: a working increment does not sit unmerged over a"
            echo "quality nit). This is not a block; do not read the wording as one."
            echo "did=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "tail-lab review loop"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "[review-fix] round $(( ${{ steps.rounds.outputs.count }} + 1 )): apply design-review findings

          Automated response to the adversarial review on PR #${{ github.event.pull_request.number }}.
          Pushed with AGENT_FIX_TOKEN so this triggers a fresh CI run and a fresh,
          independent review of the fixed code (docs/adr/0024)."
          # Credentials are no longer persisted in .git/config (see the
          # checkout step), so the token is supplied here, for this one push,
          # and never written to disk where the reviewer's Bash could read it.
          if git push \
               "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
               "HEAD:${HEAD_REF}"; then
            echo "did=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::AGENT_FIX_TOKEN could not push. The fix was computed and is"
            echo "being discarded. Check the secret holds a LIVE fine-grained PAT with"
            echo "Contents: read & write on this repo — a revoked or truncated value"
            echo "gives exactly this. Until then the loop cannot close and blocked PRs"
            echo "need a human."
            echo "did=push_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce the verdict
        if: always()
        run: |
          set -uo pipefail
          v="${{ steps.verdict.outputs.value }}"
          rounds="${{ steps.rounds.outputs.count }}"
          if [ "$v" = "NONE" ]; then
            reason="${{ steps.verdict.outputs.reason }}"
            if [ "$reason" = "workflow_edit_skip" ]; then
              echo "::warning::reviewer skipped: this PR edits .github/workflows."
              echo "claude-code-action refuses to run when the calling workflow differs"
              echo "from the copy on the default branch, so a PR cannot rewrite the"
              echo "reviewer that judges it. Such a PR is on automerge.yml's"
              echo "constitution list and will not auto-merge — a human reads it"
              echo "regardless, so this check passes rather than blocking every"
              echo "workflow change. See docs/adr/0025."
              exit 0
            fi
            if [ "$reason" = "stale_branch_skip" ]; then
              echo "::error::The design reviewer did not run because this BRANCH IS STALE."
              echo
              echo "claude-code-action requires the workflow file to match the copy on"
              echo "the default branch. This PR touches no workflow — but main changed"
              echo "ci.yml after the branch was cut, so the check fails anyway and the"
              echo "review is skipped."
              echo
              echo "That combination is the dangerous one: the PR is unreviewed AND"
              echo "perfectly mergeable. It is also the COMMON one — every branch older"
              echo "than the last ci.yml change is in it. PR #76 merged this way on"
              echo "2026-09-03 with no review at all."
              echo
              echo "FIX: rebase or merge main into this branch, then push. The review"
              echo "will run. Do not override this."
              exit 1
            fi
            if [ "$reason" = "ran" ]; then
              echo "::error::The reviewer RAN but wrote no verdict — the sentinel it"
              echo "writes on entry is present, so this is not an outage. Read its"
              echo "comment on this PR: the review exists, only the one-word verdict"
              echo "is missing. Merge by hand if the review is clean."
              exit 1
            fi
            if [ "$reason" = "classify_failed" ]; then
              echo "::error::The reviewer produced no verdict AND the cause could not be"
              echo "determined — the GitHub API call that distinguishes them failed."
              echo "This is most likely a rate limit or a transport blip, NOT anything"
              echo "about your branch. RE-RUN THIS JOB. Do not rebase; that is the fix"
              echo "for a different cause and will not help here."
              exit 1
            fi
            echo "::error::The design reviewer did not run (reason: $reason). That points"
            echo "at an expired CLAUDE_CODE_OAUTH_TOKEN, an API outage, a usage limit or"
            echo "an action regression — leaving this PR unreviewed but otherwise"
            echo "mergeable, the one combination that must not pass silently."
            echo
            echo "A human should review and merge this one, and the reviewer must be"
            echo "fixed before the loop is relied on again."
            exit 1
          fi
          if [ "$v" = "UNRECOGNISED" ]; then
            echo "::error::The reviewer's verdict could not be read. Blocking, because"
            echo "an unreadable verdict is not a clean one — and the failure mode this"
            echo "guards is specific: the reviewer writes the one word that must always"
            echo "block, decorated (\`**DEFECT**\`), and an exact match misses it."
            echo "Read the review comment on this PR and merge by hand if it is fine."
            exit 1
          fi
          if [ "$v" = "PASS" ]; then
            echo "review clean after $rounds fix round(s) — the loop has terminated."
            exit 0
          fi
          if [ "$v" = "DEFECT" ]; then
            echo "::error::Design review found a DEFECT: merging this would ship a"
            echo "breakage (build/tooling broken, a test weakened to get green, an auth"
            echo "or data-integrity fault, or a constitution violation). This never"
            echo "auto-merges at any number of rounds. A human must read the review."
            exit 1
          fi
          if [ "${{ steps.pushed.outputs.did }}" = "push_failed" ]; then
            echo "::error::The reviewer found FINDINGS and the fixer resolved them, but the"
            echo "push was rejected — so this is a CREDENTIAL fault, not a design objection."
            echo "Fix AGENT_FIX_TOKEN; do not go looking for a problem in the diff."
            exit 1
          fi
          if [ "${{ steps.pushed.outputs.did }}" = "true" ]; then
            echo "::notice::Findings applied and pushed. This run fails on purpose: the"
            echo "fresh run triggered by that push carries the authoritative review."
            exit 1
          fi
          # FINDINGS that the loop could not fix -- because it is out of rounds, or
          # has no token, or the fixer reasonably disagreed with the reviewer.
          #
          # This MERGES. A correct increment must not rot unmerged because a quality
          # nit could not be automated away: that is how a repo stops shipping, and
          # it is what happened here for four days from 2026-08-29. The finding is
          # not lost -- the daily agent reads review comments on merged PRs (its step
          # 2b) and either fixes or files them, so the cost of merging is a delay,
          # while the cost of stalling is the increment.
          if [ "$v" = "FINDINGS" ]; then
            echo "::warning::Design review left unresolved FINDINGS after $rounds fix round(s)."
            echo "Merging anyway, by design (docs/adr/0024): a working increment does not sit"
            echo "unmerged over a quality finding. The findings stay in the review comment and"
            echo "the daily agent picks them up on its next run."
            exit 0
          fi
          # Every verdict is handled above. Reaching here means one was added
          # without a branch, and the safe answer to "a state nobody wrote a
          # rule for" is to stop. This used to be a bare `exit 0`, which made
          # the merge path the default for anything unmatched.
          echo "::error::Unhandled verdict '$v' — blocking rather than assuming it is safe."
          exit 1

  trigger-deploy:
    needs: [backend, hygiene, frontend, e2e, constitution-guard]  # not agent-review: it is pull_request-only, so it never runs on this push-to-main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main

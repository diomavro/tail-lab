name: CI

# Every gate in `make check`, plus the frontend build and the browser suite —
# nothing merges red. No external accounts are needed and nothing here touches
# the network: the VIX adapter's live call is only exercised by
# `make ingest-vix` (a human-run target), and the Playwright suite answers
# every /api/** call from `frontend/e2e/fixtures/` (docs/adr/0017).

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the automerge workflow after it squash-merges an agent PR:
  # pushes made with GITHUB_TOKEN do not trigger `push` workflows (GitHub's
  # recursion prevention), but workflow_dispatch is exempt — so this is how
  # an auto-merged commit on main gets CI (and, via the Deploy workflow's
  # workflow_run trigger, gets deployed). See docs/adr/0016.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format --check
        run: ruff format --check src tests scripts

      - name: mypy --strict (src/tail_lab)
        run: mypy src/tail_lab

      - name: import-linter (module layering)
        run: lint-imports

      - name: pytest (with coverage)
        run: python -m pytest --cov=tail_lab --cov-report=term-missing --cov-report=xml

      - name: coverage floors (research/ + transforms/ >= 90%, STANDARDS §e)
        run: coverage report --include="src/tail_lab/research/*,src/tail_lab/transforms/*" --fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

      - name: npm run build
        run: npm run build

  # The browser suite. Hermetic by construction — Playwright starts its own Vite
  # dev server and `e2e/fixtures/mock-api.ts` answers every /api/** call, so this
  # needs no lake, no backend and no network, and it is deterministic enough to
  # gate a deploy on. It is a separate job from `frontend` so a red run says
  # "e2e", not "build", and so the fast build gate stays fast.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # Keyed on the lockfile: the browser build Playwright wants is pinned by
      # the @playwright/test version, so a lockfile change is exactly when the
      # cache should miss.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Chromium only — the suite declares one project. `--with-deps` still runs
      # on a cache hit (it installs the system libraries, not the browser) and
      # is cheap once the download is skipped.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run e2e
        run: npm run e2e

      # Traces and failure screenshots, per playwright.config.ts's
      # retain-on-failure / only-on-failure. The `list` reporter writes no HTML
      # report, so this is the artifact worth keeping.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The "constitution" (big-picture docs) stays human-curated: an agent/* PR
  # that edits it fails here, so auto-merge cannot land it — a human must.
  # Human PRs are unaffected. Required check, so auto-merge can't skip it.
  constitution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block autonomous edits to the constitution
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$HEAD_REF" != agent/* ]]; then
            echo "Not an agent PR (head='$HEAD_REF') — constitution guard N/A."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^docs/adr/|^\.github/workflows/|^ARCHITECTURE\.md$|^docs/STANDARDS\.md$|^README\.md$|^docs/AGENT_MISSION\.md$|^docs/END_STATE\.md$'; then
            echo "::error::This agent PR edits the constitution (docs/adr, ARCHITECTURE.md, STANDARDS.md, README.md, AGENT_MISSION.md, END_STATE.md) or .github/workflows (where the agent's own instructions and this guard live). A human must review + merge it — auto-merge is blocked."
            exit 1
          fi
          echo "OK: agent PR leaves the constitution untouched."

  # Chain to Deploy via workflow_dispatch — the one trigger type exempt from
  # GitHub's GITHUB_TOKEN recursion prevention. A workflow_run trigger on
  # Deploy would never fire for bot-initiated CI runs (the auto-merge path),
  # because the suppression also swallows the workflow_run event a
  # bot-initiated run emits on completion (docs/adr/0016, found on PR #11).
  # Runs only on main (push or dispatched-by-automerge), only when every
  # gate above is green.
  # Reviews what every other gate here is structurally blind to. ruff, mypy,
  # import-linter and the coverage floors can prove a change is correct, typed,
  # layered and tested; none of them can see duplication, dead abstraction, or
  # a function quietly growing its fourteenth parameter.
  #
  # That blindness matters because 75% of merged PRs in this repo are written
  # by an unattended agent that auto-merges on green CI, and whose charter
  # (rightly) forbids it from cleaning up anything unrelated to its task.
  # Measured 2026-08-28: the agent adds 15.8 lines for every 1 it deletes;
  # humans on this same repo run 2.4:1. Nothing was watching that number.
  #
  # Runs as a JOB IN CI rather than a workflow_run listener on purpose:
  # workflow_run events from bot-initiated runs are suppressed by GitHub
  # (docs/adr/0016), so a listener would never fire on the exact PRs it exists
  # to review. As a CI job it also blocks auto-merge for free -- automerge.yml
  # only acts when the whole CI run succeeded.
  agent-review:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Adversarial design review
        uses: anthropics/claude-code-action@v1
        # continue-on-error, because the step below is the fallback and a failing
        # step would abort the job before ever reaching it. That is exactly what
        # happened 2026-08-29..09-01: the action refused to start, the job died
        # here, and five green PRs sat blocked for four days by a gate that had
        # never formed an opinion. docs/adr/0023 says "a reviewer that cannot run
        # must not become a gate that cannot open" -- this is the line that makes
        # that true rather than aspirational.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses bot-triggered runs by default, to stop an
          # attacker driving it through a bot-authored PR. Every PR this job
          # reviews is opened by `claude[bot]` -- the daily agent -- so without
          # this the reviewer can never run on the only PRs it exists for.
          #
          # Named, not `*`: the trust boundary is the same one docs/adr/0016
          # already accepted for the daily agent itself, whose inputs are this
          # repo's own backlog and code rather than untrusted external data. A
          # wildcard would extend that to any bot that ever opens a PR here.
          allowed_bots: 'claude'
          claude_args: '--allowedTools Bash,Read,Grep,Glob'
          prompt: |
            You are the adversarial design reviewer for an autonomous agent's pull request.
            You did not write this change and have no stake in it landing.

            Read the diff first:  git diff "$BASE_SHA...HEAD"

            **What you are NOT for.** Correctness, types, layering, formatting and coverage are
            already proven by other jobs in this same run. Do not re-check them. Do not comment
            on style the formatter owns. If your finding would have been caught by ruff or mypy,
            it is not your finding.

            **What you ARE for** — the four things no linter here can see:

            1. DUPLICATION. Does this re-implement something that already exists? Search before
               concluding it does not: `grep -rn` for the key function names, and for the same
               computation expressed differently. This repo has genuine near-duplicates by
               design (one ingestion adapter per dataset, deliberately) — that pattern is
               sanctioned in ingestion/ and is NOT a finding. Duplication inside research/ or
               api/ is.
            2. DEAD OR SPECULATIVE CODE. A parameter nothing passes, a branch nothing reaches,
               an abstraction with exactly one implementation and no second one in sight, an
               exported name nothing imports.
            3. ACCRETION. Did a function gain parameters instead of being reshaped? Did a module
               grow past the point where it is one thing? The known offenders are listed in
               AGENT_TODO.md; a change that makes one of them worse is a finding even if it is
               small.
            4. UNEARNED COMPLEXITY. Would a reader with no context understand why this shape was
               chosen? Is there a materially simpler version that passes the same tests?

            **The bar for BLOCKING is high, deliberately.** This job gates auto-merge, so a
            false positive stops the platform's only daily increment and costs a human's
            morning. Block ONLY when you can name the specific file and line, quote the code,
            and state what should have happened instead. Taste disagreements, "I would have
            named it differently", and speculative future-proofing concerns are ADVISORY, never
            blocking. **When you are uncertain, pass.** A missed nit is cheap; a stalled
            pipeline is not.

            Post your review as a PR comment either way, so there is a record that a review
            happened and what it said:
              gh pr comment "$PR_NUMBER" --body "<your review>"

            Then write your verdict to a file, exactly one word, nothing else:
              echo PASS  > /tmp/verdict    (nothing blocking; advisory notes are fine)
              echo BLOCK > /tmp/verdict    (a specific, quoted, actionable defect)

      - name: Enforce the verdict
        run: |
          set -uo pipefail
          verdict="$(cat /tmp/verdict 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$verdict" ]; then
            echo "::warning::reviewer produced no verdict — treating as PASS."
            echo "A reviewer that cannot run must not become a gate that cannot open:"
            echo "an outage here would silently halt the daily increment. This is"
            echo "not hypothetical — it halted it for four days from 2026-08-29."
            echo "If you see this warning repeatedly, the reviewer is broken and"
            echo "is silently reviewing nothing. Fix it or remove the job; do not"
            echo "leave a green check standing for a review that never happened."
            exit 0
          fi
          echo "verdict: $verdict"
          if [ "$verdict" = "BLOCK" ]; then
            echo "::error::Design review blocked this PR. See the review comment on the PR."
            exit 1
          fi
          exit 0

  trigger-deploy:
    needs: [backend, frontend, e2e, constitution-guard]  # not agent-review: it is skipped on non-agent branches
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main

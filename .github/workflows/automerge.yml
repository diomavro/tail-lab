name: Auto-merge reviewed PRs

# Merges a PR automatically once CI is fully green — no human in the loop for
# ordinary increments. Fires when the CI workflow completes, and only when CI
# *succeeded*, so a failed test, lint, constitution-guard or adversarial-review
# job leaves the PR open. This is the free-plan stand-in for
# branch-protection-gated auto-merge (private repos need GitHub Pro for
# required-status-check protection).
#
# Every branch, not only `agent/*` (`docs/adr/0025`). The loop this closes is:
# an agent writes the PR, an adversarial reviewer reads it, a fixer judges
# whether the critique is fair and either applies it or records a reasoned
# disagreement, and that repeats until the review has nothing important left --
# then it merges. Scoping the merge to agent branches while the review ran on
# everything left every other PR stuck at step 2 forever, which is the alarm
# `docs/adr/0024` was written to replace.
#
# TWO things still stop an auto-merge, deliberately:
#   * a DRAFT PR, which is a proposal and not a request to merge;
#   * a PR touching the constitution (`docs/adr/**`, `.github/workflows/**`,
#     README/ARCHITECTURE/STANDARDS/AGENT_MISSION/END_STATE) — the rules that
#     govern the agents cannot be changed by the agents, so a human merges
#     those by hand (`docs/adr/0022`). The check below is the enforcement
#     point for EVERY author; `constitution-guard` in CI only covers `agent/*`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch CI on main after the merge (see below)

jobs:
  merge:
    # Any branch, as long as the whole CI run passed (which now includes the
    # adversarial review's verdict — see `agent-review` in ci.yml).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the reviewed PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "CI on main — nothing to merge."
            exit 0
          fi
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                 --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH — nothing to merge."
            exit 0
          fi
          if [ "$(gh pr view "$pr" --repo "$REPO" --json isDraft -q .isDraft)" = "true" ]; then
            echo "PR #$pr is a draft — a proposal, not a request to merge."
            exit 0
          fi
          # The enforcement point for EVERY author. `constitution-guard` in CI
          # only fires on `agent/*`, so for any other branch this check is not
          # belt-and-suspenders: it is the belt.
          files=$(gh pr view "$pr" --repo "$REPO" --json files -q '.files[].path')
          if echo "$files" | grep -qE '^docs/adr/|^\.github/workflows/|^ARCHITECTURE\.md$|^docs/STANDARDS\.md$|^README\.md$|^docs/AGENT_MISSION\.md$|^docs/END_STATE\.md$'; then
            echo "PR #$pr edits the constitution — leaving it for a human."
            exit 0
          fi
          echo "Merging PR #$pr (CI green)…"
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
          # The squash-merge above is pushed with GITHUB_TOKEN, and GitHub
          # suppresses workflow triggers from GITHUB_TOKEN pushes (recursion
          # prevention) — so the merge commit would get no push-CI and hence
          # no Deploy (docs/adr/0016). workflow_dispatch is exempt from that
          # suppression: dispatch CI on main so the actual merge commit is
          # fully validated; CI's trigger-deploy job then dispatches Deploy
          # the same way (workflow_run events from bot-initiated runs are
          # suppressed too, so every bot-path hop must be a dispatch).
          echo "Dispatching CI on main so the merge commit is validated and deployed…"
          gh workflow run ci.yml --repo "$REPO" --ref main
